; TrinityWeb360 Flasher — ESP32-S3 N16R8
; All-on-chip Xbox 360 Trinity NAND flasher + RGH image builder with phone web UI.
;
; Derived from GxOSS/espflasher (GPL-3.0), which in turn derives from
; balika011/PicoFlasher. See NOTICE and LICENSE.

[platformio]
src_dir = main
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; --- ESP32-S3 N16R8: 16MB flash, 8MB octal PSRAM ---
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -mfix-esp32-psram-cache-issue
    -DPFC_TARGET_S3=1
